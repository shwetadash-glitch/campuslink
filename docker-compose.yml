version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    # Local development database container (NOT for production use)
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-campuslink_dev}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local_dev_secret_change_me}
      POSTGRES_DB: ${LOCAL_DB_NAME:-campuslink_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-campuslink_dev} -d ${LOCAL_DB_NAME:-campuslink_local}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
